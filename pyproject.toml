[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seagreen"
version = "2.0.0"
description = "Live process energy & carbon monitoring for developers"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Serene Interactive, Global"},
]
dependencies = [
    "psutil>=5.9.0",
    "rich>=13.0.0",
]

[project.scripts]
seagreen = "seagreen.__main__:main"

[tool.setuptools.packages.find]
include = ["seagreen*"]
