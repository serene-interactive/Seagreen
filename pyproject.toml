[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seagreen"
version = "3.0.0"
description = "Local resource and energy monitoring with a macOS app and web UI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Serene Interactive, Global"},
]
dependencies = [
    "psutil>=5.9.0",
    "rich>=13.0.0",
]

[project.scripts]
seagreen = "seagreen.__main__:main"
seagreen-web = "seagreen.server:main"

[tool.setuptools.packages.find]
include = ["seagreen*"]

[tool.setuptools.package-data]
seagreen = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg"]
