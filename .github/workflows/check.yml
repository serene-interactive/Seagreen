name: Seagreen checks
permissions:
  contents: read
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  web:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash desktop/scripts/build.sh
      - run: bash desktop/scripts/test.sh
      - run: ARCH=x86_64 bash desktop/scripts/build.sh
      - run: bash desktop/scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Seagreen-v3.0.0-macOS
          path: desktop/build/releases/*
